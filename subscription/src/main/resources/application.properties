spring.application.name=subscription-management

server.port=8000

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/subscription_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

#spring.data.redis.host=localhost
#spring.data.redis.port=6379

#jwt.secret=&}t%,1.:4@+T9xO$;Jo$_4hmO=&FWZ3LTREp%Jw{m[*
#jwt.expiration=1200000

spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true

# ===============================
# SCHEDULER CONFIGURATION
# ===============================
# Override with a shorter cron during local development, e.g. "0/30 * * * * *"
subscription.expiry.cron=0/30 * * * * *

# ===============================
# SUBSCRIPTION DEFAULTS
# ===============================
# Duration in days for auto-created subscriptions from purchase events
subscription.default.duration-days=30
