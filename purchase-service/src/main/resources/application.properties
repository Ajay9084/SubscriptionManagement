spring.application.name=purchase-service

server.port=8001

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/purchase_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# FEIGN
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=5000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# ===============================
# API DOCS
# ===============================
# Swagger UI: http://localhost:8001/swagger-ui/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui/index.html

# ===============================
# SERVICE URLS
# ===============================
subscription.service.url=http://localhost:8000

# ===============================
# SUBSCRIPTION DEFAULTS
# ===============================
# Duration in days for auto-created subscriptions on purchase
subscription.default.duration-days=30